name: Build and push image DOTNET

on:
  workflow_dispatch: {}

jobs:

  build-and-push:
    name: Build and push DOTNET
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v2
      - name: Build and validate
        run: |
          echo "docker build"
          docker build -t mi-app:1.0.0 .
          docker images
          docker ps
          docker run -d --name mi-contenedor -p 8080:8080 mi-app:1.0.0
          docker ps
          sleep 10

                  