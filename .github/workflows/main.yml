name: Build and push image JAVA

on:
  workflow_dispatch: {}

jobs:

  build-and-push:
    name: Build and push JAVA
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v2
      - name: Build and validate
        run: |
          echo "DOCKER IMAGES 0"
          docker images        
          echo "docker build"
          docker build -t mi-app:1.0.0 .
          echo "DOCKER IMAGES 1"
          docker images
          echo "DOCKER PS 0"
          docker ps     
          echo "DOCKER RUN"
          docker run -d --name mi-contendor -p 8081:8081 -e SERVER_ADDRESS=0.0.0.0 mi-app:1.0.0
          echo "DOCKER PS 1"
          docker ps
          sleep 10
          echo "DOCKER PS -a"
          docker ps -a
          echo "DOCKER LOG"
          docker logs mi-contedor


                  
