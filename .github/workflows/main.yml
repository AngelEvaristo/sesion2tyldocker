name: Build and push image JAVA

on:
  workflow_dispatch: {}

jobs:

  build-and-push:
    name: Build and push JAVA
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v2
      - name: Build and validate
        run: |
          echo "DOCKER IMAGES 0"
          docker images        
          echo "docker build"
          docker build -t mi-app:1.0.0 .
          echo "DOCKER IMAGES 1"
          docker images
          echo "DOCKER PS 0"
          docker ps     
          echo "DOCKER RUN"
          docker run -d --name mi-contenedor -p 8081:8081 -e SERVER_ADDRESS=0.0.0.0 mi-app:1.0.0
          echo "DOCKER PS 1"
          docker ps
          sleep 10
          echo "DOCKER PS -a"
          docker ps -a
          echo "DOCKER LOG"
          docker logs mi-contenedor
          curl http://localhost:8081/weatherForecast
          echo "DOCKER STOP"
          docker stop mi-contenedor
          echo "DOCKER PS 2"
          docker ps
          echo "DOCKER PS -a 2"
          docker ps -a      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1              
        with:
          aws-access-key

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Build, Tag and Push image ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ecrtecylabs2
          IMAGE_TAG: 1.0.0
        run:
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker images
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


                  
