name: Build and push image JAVA

on:
  workflow_dispatch: {}

jobs:

  build-and-push:
    name: Build and push JAVA
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v2
      - name: Build and validate
        run: |
          echo "DOCKER IMAGES 0"
          docker images        
          echo "docker build"
          docker build -t mi-app:1.0.0 .
          echo "DOCKER IMAGES 1"
          docker images
          echo "DOCKER PS"
          docker ps          

                  
